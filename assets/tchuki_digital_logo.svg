<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" fill="none">
  <defs>
    <linearGradient id="blueCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="digitalTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
  </defs>

  <!-- Stylized Tech "T" -->
  <g transform="translate(20, 20)">
    <!-- Top Horizontal Hook of T -->
    <path d="M 10 35 C 10 20, 30 10, 65 10 L 140 10 C 150 10, 155 18, 148 26 C 135 42, 115 50, 75 50 L 50 50 C 30 50, 20 60, 20 75 L 20 150 C 20 180, 45 200, 75 200 C 105 200, 120 180, 120 150 L 120 100 L 95 100 L 95 70 L 155 70 L 155 150 C 155 195, 120 225, 75 225 C 28 225, 0 190, 0 140 L 0 55 C 0 45, 3 38, 10 35 Z" fill="url(#blueCyanGrad)" />

    <!-- Purple inner bar -->
    <rect x="90" y="85" width="30" height="70" rx="10" fill="url(#purpleGrad)" />

    <!-- Pixel blocks floating on top right of T -->
    <rect x="135" y="10" width="22" height="22" rx="4" fill="#00A3FF" />
    <rect x="165" y="10" width="22" height="22" rx="4" fill="#0066FF" />
    <rect x="135" y="40" width="22" height="22" rx="4" fill="#0077FF" />
    <rect x="165" y="40" width="22" height="22" rx="4" fill="#00D2FF" />
    <rect x="165" y="70" width="22" height="22" rx="4" fill="#8B5CF6" />
  </g>

  <!-- Typography: Tchuki DIGITAL -->
  <!-- "Tchuki" -->
  <text x="230" y="130" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="78" fill="#ffffff" letter-spacing="-1">
    Tchuki
  </text>
  
  <!-- "DIGITAL" -->
  <text x="232" y="195" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="62" fill="url(#digitalTextGrad)" letter-spacing="4">
    DIGITAL
  </text>

  <!-- Tagline: TURNING IDEAS INTO DIGITAL SOLUTIONS -->
  <text x="234" y="235" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="14.5" fill="#94A3B8" letter-spacing="5">
    TURNING IDEAS INTO DIGITAL SOLUTIONS
  </text>
</svg>
